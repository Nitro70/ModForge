# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version={{MinecraftVersion}}
loader_version={{LoaderVersion}}
loom_version={{LoomVersion}}

# Mod Properties
version={{Version}}
group={{Package}}

# Dependencies
{{#if FabricApiVersion}}
fabric_api_version={{FabricApiVersion}}
{{#elif MinecraftVersion == 26.3}}
fabric_api_version=0.165.2+26.3
{{#elif MinecraftVersion == 26.2}}
fabric_api_version=0.161.0+26.2
{{#else}}
fabric_api_version=0.155.3+26.1.2
{{/if}}
